services:
  postgres:
    image: postgres:16-alpine
    container_name: duck-auth-demo-pg
    environment:
      POSTGRES_DB: duck_auth_demo
      POSTGRES_USER: duck
      POSTGRES_PASSWORD: duck_dev_pw
    ports:
      - '5433:5432'
    volumes:
      - duck-auth-demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duck -d duck_auth_demo']
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  duck-auth-demo-pgdata:
